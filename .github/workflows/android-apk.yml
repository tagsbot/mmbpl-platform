name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install & sync Capacitor
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/MMB-Library.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MMB-Library-apk
          path: ${{ runner.temp }}/MMB-Library.apk

      - name: Publish to "apk-builds" branch
        run: |
          cd "$RUNNER_TEMP"
          rm -rf out && mkdir out && cd out
          git init -q -b apk-builds
          cp "$RUNNER_TEMP/MMB-Library.apk" .
          echo "Built from ${GITHUB_SHA} on $(date -u)" > BUILD.txt
          git add . && git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-builds

      - name: Publish release "app-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: MMB Library app (latest test build)
          prerelease: true
          files: ${{ runner.temp }}/MMB-Library.apk
          body: Test build of the MMB Library Android app. Built from ${{ github.sha }}.
